spring.application.name=hitboxd-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:hitboxd;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# campos booleanos omitidos no JSON viram false (o Jackson 3 rejeita por padrão)
spring.jackson.deserialization.fail-on-null-for-primitives=false

# popula o banco com usuários, avaliações e listas de exemplo
hitboxd.seed=true

# login com o Google: client ID OAuth do tipo "Aplicativo da Web" (Google Cloud Console)
hitboxd.google.client-id=${GOOGLE_CLIENT_ID:}
# contas administradoras: e-mails separados por vírgula. Só vale com e-mail confirmado pelo Google.
hitboxd.admin-emails=${ADMIN_EMAILS:vitorrreg@gmail.com}
# senha das contas de exemplo; sem ela, as contas de exemplo não entram com senha
hitboxd.demo-password=${DEMO_PASSWORD:}
